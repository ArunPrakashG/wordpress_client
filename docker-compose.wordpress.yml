# Local WordPress for the integration tests (official images).
#
#   docker compose -f docker-compose.wordpress.yml up -d --wait
#   docker compose -f docker-compose.wordpress.yml run --rm setup
#
# `setup` installs WordPress, sets pretty permalinks, installs the plugins in
# WP_PLUGINS and is safe to run again. Then point the tests at the site:
#
#   WP_BASE_URL=http://localhost:8080/wp-json/wp/v2 WP_USERNAME=admin \
#   WP_PASSWORD=password dart test -t integration
#
# For application password auth, create one and pass it as WP_APP_PASSWORD:
#
#   docker compose -f docker-compose.wordpress.yml run --rm -T setup \
#     wp user application-password create admin tests --porcelain

x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  # `local` enables application passwords over plain HTTP.
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', 'local');
    define('JWT_AUTH_SECRET_KEY', 'local-tests-only');
    define('JWT_AUTH_CORS_ENABLE', true);

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment: *wordpress-env
    volumes:
      - wordpress_data:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php && curl -s -o /dev/null http://localhost/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  setup:
    image: wordpress:cli
    profiles: ["setup"]
    # Same user as the Apache image, so both can write the shared files.
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      <<: *wordpress-env
      HOME: /tmp
      WP_URL: ${WP_URL:-http://localhost:8080}
      WP_USERNAME: ${WP_USERNAME:-admin}
      WP_PASSWORD: ${WP_PASSWORD:-password}
      WP_EMAIL: ${WP_EMAIL:-admin@example.com}
      WP_PLUGINS: ${WP_PLUGINS:-jwt-authentication-for-wp-rest-api wp-graphql}
    volumes:
      - wordpress_data:/var/www/html
    command:
      - sh
      - -ec
      - |
        until wp db query "SELECT 1" >/dev/null 2>&1; do sleep 2; done
        wp core is-installed || wp core install --url="$$WP_URL" \
          --title=wordpress-client-tests --admin_user="$$WP_USERNAME" \
          --admin_password="$$WP_PASSWORD" --admin_email="$$WP_EMAIL" --skip-email
        wp rewrite structure '/%postname%/'
        wp rewrite flush
        for plugin in $$WP_PLUGINS; do
          wp plugin is-installed "$$plugin" || wp plugin install "$$plugin"
          wp plugin activate "$$plugin"
        done
        echo "WordPress ready at $$WP_URL"

volumes:
  db_data:
  wordpress_data:
