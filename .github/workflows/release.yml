# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Release (bump and tag)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type or explicit version (patch/minor/major or 1.2.3)"
        required: true
        default: patch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pushes below choose their own token.
          persist-credentials: false

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Publish dry-run
        run: dart pub publish --dry-run

      - name: Bump version in pubspec.yaml
        id: bump
        run: |
          NEW_VER=$(dart run tool/bump_version.dart "${{ github.event.inputs.bump }}")
          echo "new_version=$NEW_VER" >> $GITHUB_OUTPUT

      - name: Ensure version changed
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          if [ "v$CURRENT" != "v${{ steps.bump.outputs.new_version }}" ]; then
            echo "Version in pubspec.yaml is $CURRENT but bump script reported ${{ steps.bump.outputs.new_version }}"
            exit 1
          fi

      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"

      - name: Create tag
        run: |
          git tag v${{ steps.bump.outputs.new_version }}

      # A tag pushed with GITHUB_TOKEN does not start other workflows, so
      # publish.yml would not run. The tag is pushed with the GH_TOKEN secret
      # (a token with contents: write) when it is set.
      - name: Push changes and tag
        env:
          VERSION: ${{ steps.bump.outputs.new_version }}
          ACTIONS_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          repo="github.com/${GITHUB_REPOSITORY}.git"
          git push "https://x-access-token:${ACTIONS_TOKEN}@${repo}" HEAD:master
          if [ -n "$RELEASE_TOKEN" ] && git push "https://x-access-token:${RELEASE_TOKEN}@${repo}" "v${VERSION}"; then
            echo "Tag v${VERSION} pushed; publish.yml publishes it to pub.dev."
          else
            git push "https://x-access-token:${ACTIONS_TOKEN}@${repo}" "v${VERSION}"
            echo "::warning::Tag pushed with GITHUB_TOKEN, so publish.yml will not start. Set a valid GH_TOKEN secret, or re-push the tag: git push origin :refs/tags/v${VERSION} && git push origin v${VERSION}"
          fi

      - name: Create GitHub release
        env:
          VERSION: ${{ steps.bump.outputs.new_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          dart run tool/changelog_section.dart "$VERSION" > release-notes.md ||
            echo "See CHANGELOG.md for the changes in ${VERSION}." > release-notes.md
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file release-notes.md --verify-tag
